; Vision AI Assist — firmware for the WeAct Studio STM32H743VIT6 core board
; Build:  pio run          Upload (ST-Link): pio run -t upload
; Upload over USB DFU instead: pio run -e weact_h743_dfu -t upload  (hold BOOT0, tap RESET)

[platformio]
default_envs = weact_h743

[env]
platform = ststm32
board = weact_mini_h743vitx
framework = arduino
monitor_speed = 115200
lib_deps =
    stm32duino/STM32duino FreeRTOS@^10.3.2
    spaziochirale/Chirale_TensorFLowLite@^2.0.0
    pololu/VL53L0X@^1.3.1
    adafruit/Adafruit DRV2605 Library@^1.2.4
    adafruit/Adafruit GFX Library@^1.11.11
    adafruit/Adafruit ST7735 and ST7789 Library@^1.10.4
    https://github.com/stm32duino/FatFs.git#4.0.0
    stm32duino/STM32duino STM32SD@^1.5.0
build_flags =
    -O2
    -Iinclude
    ; USB CDC serial (Serial = USB) for logs and the frame viewer
    -D PIO_FRAMEWORK_ARDUINO_ENABLE_CDC
    -D USBCON
    -D USBD_USE_CDC
    ; STM32SD: no card-detect pin on the WeAct board
    -D SD_DETECT_NONE
build_unflags = -Os

[env:weact_h743]
upload_protocol = stlink
debug_tool = stlink

[env:weact_h743_dfu]
upload_protocol = dfu
